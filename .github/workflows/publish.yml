name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual publishing from the Actions tab (tag like v0.1.4).
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Two supported authentication modes:
    #   1. Repository secret PYPI_API_TOKEN (simplest): used when present.
    #   2. PyPI Trusted Publishing (OIDC): used otherwise. Requires
    #      https://pypi.org/manage/project/freepygame/settings/publishing/
    #      to be configured for this repository + publish.yml.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Select PyPI authentication mode
        id: auth
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using PYPI_API_TOKEN secret."
          else
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "PYPI_API_TOKEN not set; falling back to Trusted Publishing."
          fi

      - name: Publish to PyPI (API token)
        if: steps.auth.outputs.mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.auth.outputs.mode == 'trusted'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
